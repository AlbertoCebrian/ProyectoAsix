<header>
  <div class="header-container">
    
    <a routerLink="/" class="logo">
      <img src="/assets/logoheader.png" alt="InfoTec">
    </a>

    <div class="search-bar">
      <input 
        #sInput 
        type="text" 
        placeholder="Buscar productos, marcas..." 
        (keyup.enter)="search(sInput.value)" 
      />
      <button (click)="search(sInput.value)">
        <i class="fas fa-search"></i> 
      </button>
    </div>

    <nav class="nav-links">

        <div *ngIf="!user.token" class="guest-menu">
            <span class="welcome-text">Hola, Invitado</span>
            <a routerLink="/login" class="login-btn">Iniciar Sesión</a>
        </div>

        <div *ngIf="user.token" class="user-menu">
            <span class="welcome-text">Hola, {{ user.name }}</span>
            
            <div class="dropdown">
                <a routerLink="/dashboard" class="user-link">
                    <i class="fas fa-user-circle"></i> Mi Cuenta
                </a>
                <div class="dropdown-content">
                    <a routerLink="/profile">Perfil</a>
                    <a routerLink="/orders">Mis Pedidos</a>
                    <a (click)="logout()">Cerrar Sesión</a>
                </div>
            </div>
        </div>

        <a routerLink="/cart-page" class="cart-link">
            <i class="fas fa-shopping-cart"></i>
            <span *ngIf="cartQuantity > 0" class="cart-count">{{ cartQuantity }}</span>
        </a>

    </nav> </div> 
</header>
