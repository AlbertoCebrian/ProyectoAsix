<div class="container">
  <h1>Mis Pedidos 📦</h1>

  <div *ngIf="orders.length === 0" class="no-orders">
    <p>Aún no has realizado ninguna compra.</p>
    <a routerLink="/" class="btn-shop">Ir a la tienda</a>
  </div>

  <div class="orders-list">
    <div *ngFor="let order of orders" class="order-card">
      
      <div class="order-header">
        <span class="order-id">Pedido #{{ order.id || 'NUEVO' }}</span> <span class="order-date">{{ order.createdAt | date:'short' }}</span>
        <span class="order-status status-new">PAGADO ✅</span>
      </div>

      <div class="order-items">
        <div *ngFor="let item of order.items" class="item-row">
            <img [src]="item.product.images?.[0]" [alt]="item.product.name" class="item-img">          <div class="item-details">
             <span class="item-name">{{ item.product.name }}</span>
             <span class="item-qty">x{{ item.quantity }}</span>
          </div>
          <span class="item-price">{{ item.price | currency:'EUR' }}</span>
        </div>
      </div>

      <div class="order-footer">
        <span>Total Pagado:</span>
        <span class="total-price">{{ order.totalPrice | currency:'EUR' }}</span>
      </div>

    </div>
  </div>
</div>
