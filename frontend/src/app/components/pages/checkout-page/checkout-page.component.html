<div class="container">
  
  <div class="checkout-layout">
    
    <div class="form-section">
      <h2 class="section-title">Datos de Envío</h2>
      
      <form [formGroup]="checkoutForm" (ngSubmit)="createOrder()">
        
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" formControlName="name" placeholder="Quién recibe el paquete">
        </div>

        <div class="form-group">
          <label>Dirección de Entrega</label>
          <input type="text" formControlName="address" placeholder="Calle, número, ciudad...">
        </div>

        <button type="submit" class="btn-pay" [disabled]="isSubmitting">
            <span *ngIf="!isSubmitting">Confirmar y Pagar (Simulado)</span>
            <span *ngIf="isSubmitting">Procesando... ⏳</span>
        </button>

      </form>
    </div>

    <div class="summary-section">
      <h2 class="section-title">Resumen del Pedido</h2>
      
      <div class="order-items">
        <div class="item" *ngFor="let item of order.items">
          <span>{{ item.quantity }}x {{ item.product.name }}</span>
          <span class="price">{{ item.price | currency:'EUR' }}</span>
        </div>
      </div>

      <div class="total-row">
        <span>TOTAL A PAGAR</span>
        <span class="total-price">{{ order.totalPrice | currency:'EUR' }}</span>
      </div>
    </div>

  </div>
</div>
