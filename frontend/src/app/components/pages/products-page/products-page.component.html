<div class="container">
  
  <h1 class="page-title">Productos Destacados</h1>

  <div class="results-info" *ngIf="categoryFilter || products.length < 16">
    <span>
      Hemos encontrado <strong>{{ products.length }}</strong> productos
      <span *ngIf="categoryFilter"> en la categoría <strong>{{ categoryFilter | titlecase }}</strong></span>.
    </span>
  </div>

  <div class="products-grid">
    <div class="product-card" *ngFor="let product of products" [routerLink]="['/product', product._id]">
      
      <div class="image-container">
        <img 
          [src]="product.images && product.images.length > 0 ? product.images[0] : 'assets/images/default-product.png'" 
          [alt]="product.name">
      </div>

      <div class="info">
        <h3>{{ product.name }}</h3>
        <p class="brand">{{ product.brand }}</p>
        <div class="price">{{ product.price | currency:'EUR' }}</div>
      </div>

    </div>
  </div>

  <div *ngIf="products.length === 0" class="no-results">
    <p>😞 Vaya, no hemos encontrado nada con ese nombre.</p>
    <a routerLink="/" class="btn-back">Volver al inicio</a>
  </div>

</div>
