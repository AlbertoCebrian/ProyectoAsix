<div class="container">
  <div class="register-content">
    
    <div class="register-title">
      <h2>Crear Cuenta</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      
      <div class="form-group">
        <label>Nombre Completo</label>
        <input 
          type="text" 
          formControlName="name"
          [class.error]="isSubmitted && fc['name'].errors"
        >
        <div class="error-msg" *ngIf="isSubmitted && fc['name'].errors?.['required']">
          El nombre es obligatorio
        </div>
        <div class="error-msg" *ngIf="isSubmitted && fc['name'].errors?.['minlength']">
          Mínimo 2 caracteres
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          formControlName="email"
          [class.error]="isSubmitted && fc['email'].errors"
        >
        <div class="error-msg" *ngIf="isSubmitted && fc['email'].errors?.['required']">
          El email es obligatorio
        </div>
        <div class="error-msg" *ngIf="isSubmitted && fc['email'].errors?.['email']">
          Email no válido
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input 
          type="password" 
          formControlName="password"
          [class.error]="isSubmitted && fc['password'].errors"
        >
        <div class="error-msg" *ngIf="isSubmitted && fc['password'].errors?.['required']">
          La contraseña es obligatoria
        </div>
        <div class="error-msg" *ngIf="isSubmitted && fc['password'].errors?.['minlength']">
          Mínimo 5 caracteres
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar Contraseña</label>
        <input 
          type="password" 
          formControlName="confirmPassword"
          [class.error]="isSubmitted && fc['confirmPassword'].errors"
        >
        <div class="error-msg" *ngIf="isSubmitted && fc['confirmPassword'].errors?.['required']">
          Confirma tu contraseña
        </div>
        <div class="error-msg" *ngIf="isSubmitted && fc['confirmPassword'].errors?.['passwordMismatch']">
          Las contraseñas no coinciden
        </div>
      </div>

      <button type="submit" class="btn-register">Registrarme</button>

      <div class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </div>

    </form>
  </div>
</div>
