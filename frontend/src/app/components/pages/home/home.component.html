<div class="home-container">
  
  <div class="banner">
    <h2>OFERTAS ESPECIALES DE FEBRERO!</h2>
    <p>Los mejores componentes al mejor precio</p>
  </div>

  <div class="categories-preview">
    <h3>Busca por Categoría</h3>
    <div class="cat-grid">
      <a class="cat-card" 
         *ngFor="let cat of categories" 
         [routerLink]="['/products']" 
         [queryParams]="{ category: cat.id }">
        <span class="cat-name">{{ cat.name }}</span>
      </a>
    </div>
  </div>

  <h1>Productos Destacados</h1>
  
  <div class="products-grid">
    <div class="product-card" 
         *ngFor="let product of products" 
         [routerLink]="['/product', product._id]">
      
      <div class="image-container">
        <img 
          [src]="product.images && product.images.length > 0 ? product.images[0] : 'assets/images/default-product.png'" 
          [alt]="product.name">
      </div>

      <div class="info">
        <h3>{{ product.name }}</h3>
        <p class="brand">{{ product.brand }}</p>
        <div class="price">{{ product.price | currency:'EUR' }}</div>
      </div>
    </div>
  </div>

</div>
